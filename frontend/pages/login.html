<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1e3ff">
  <meta name="description" content="Log in to continue your CareerCoach AI career journey.">
  <title>Welcome Back — CareerCoach AI</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/pages/login.css">
  <script type="module" src="../js/pages/login.js"></script>
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="login-title">
    <div class="login-gloss" aria-hidden="true"></div>
    <header class="login-header">
      <a class="login-brand" href="../index.html" aria-label="CareerCoach AI home">
        <svg class="login-brand-mark" viewBox="0 0 40 36" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="login-brand-bars-gradient" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7611eb"/><stop offset="1" stop-color="#8d24f5"/></linearGradient></defs><rect x="8" y="25" width="7" height="9" rx="1.8" fill="url(#login-brand-bars-gradient)"/><rect x="18" y="19" width="7" height="15" rx="1.8" fill="url(#login-brand-bars-gradient)"/><rect x="28" y="8" width="7" height="26" rx="1.8" fill="url(#login-brand-bars-gradient)"/></svg>
        <span>CareerCoach AI<sup>®</sup></span>
      </a>
      <div class="login-title-wrap">
        <span class="login-sparkle login-sparkle-left" aria-hidden="true">✦</span>
        <h1 id="login-title">Welcome Back</h1>
        <span class="login-sparkle login-sparkle-right" aria-hidden="true">✦</span>
      </div>
      <p class="login-subtitle">Log in to continue your career journey.</p>
    </header>

    <form class="login-form" id="login-form" novalidate>
      <div class="login-field">
        <label for="login-email">Email Address <span aria-hidden="true">*</span></label>
        <div class="login-input-wrap">
          <svg class="login-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          <input id="login-email" name="email" type="email" autocomplete="username" placeholder="Enter your email address" required>
        </div>
      </div>

      <div class="login-field">
        <label for="login-password">Password <span aria-hidden="true">*</span></label>
        <div class="login-input-wrap">
          <svg class="login-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button>
        </div>
        <div class="forgot-row"><a id="forgot-password" href="#forgot-password">Forgot Password?</a></div>
      </div>

      <button class="login-submit" id="login-submit" type="submit" disabled>Log In <span aria-hidden="true">⟶</span></button>
      <p class="login-message" id="login-message" role="status" aria-live="polite"></p>
    </form>

    <p class="create-account-prompt">Don’t have an account? <a href="create-account.html">Create Account</a></p>
  </main>
</body>
</html>
